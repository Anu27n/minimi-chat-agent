<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>minimi chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside id="sidebar">
      <button id="new-chat" type="button">+ New chat</button>
      <nav id="conversations" aria-label="Conversations"></nav>
      <footer id="status"></footer>
    </aside>
    <main>
      <div id="banner" hidden></div>
      <section id="messages" aria-live="polite">
        <div id="empty">
          <h1>minimi</h1>
          <p>Ask anything. I search the web for current facts and remember what we talked about, and when.</p>
          <div id="examples">
            <button type="button">Which managed Postgres hosts have the cheapest entry plan right now?</button>
            <button type="button">What did I ask you last Tuesday? Is your answer still correct today?</button>
            <button type="button">What changed in the latest Node.js release?</button>
          </div>
        </div>
      </section>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Message minimi…" autocomplete="off" required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
